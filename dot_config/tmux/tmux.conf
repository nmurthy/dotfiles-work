set -g prefix `
bind-key ` send-prefix
set -g prefix2 C-a

set -g history-limit 50000
set -g mouse on
set -s copy-command "~/.config/tmux/scripts/wayland-copy"
setw -g mode-keys vi

set -g extended-keys on
set -g extended-keys-format csi-u

# Pass OSC 8 hyperlinks through to outer terminal (Ghostty).
set -ga terminal-features ',*:hyperlinks'

# Wayland clipboard integration for tmux copy-mode selections.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/wayland-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/wayland-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/wayland-copy"

# Paste system clipboard into tmux (prefix + P)
bind-key P run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer -p && tmux delete-buffer"

bind-key C-c display-popup -E -w 80 -h 30 "~/.cargo/bin/claude-tmux"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Initialize TMUX plugin manager (keep these lines at the very bottom of tmux.conf).
# Path set up front: install_plugins aborts without it.
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins/
if "test ! -d ~/.config/tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
